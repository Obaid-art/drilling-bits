<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drilling bits and bit hydraulics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  :root { --paper: #F6F3EC; --paper2: #EEEAE0; --card: #FFFFFF; --ink: #121A26; --body: #2B3A4C; --muted: #1F2B3A; --faint: #1F2B3A; --line: #DAD5C9; --blue: #0047BA; --blue2: #E6EDFA; --red: #B3261E; --green: #2E7D5B; --night: #0E1B33; --gold: #B7791F;
    --display: "Fraunces", Georgia, serif; --sans: "Inter", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; } [hidden] { display: none !important; }
  .top { height: 54px; display: flex; align-items: center; gap: 18px; padding: 0 18px; background: var(--night); color: #fff; }
  .top .ttl { font: 600 18px/1 var(--display); white-space: nowrap; }
  .top .src { font-size: 13px; color: #E3E9F3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps { display: flex; gap: 4px; margin-left: auto; }
  .steps button { border: 0; background: transparent; color: #F1F4F9; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; font-weight: 500; white-space: nowrap; }
  .steps button b { display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: #23365C; margin-right: 7px; font-size: 12px; text-align: center; }
  .steps button.on { background: #fff; color: var(--night); } .steps button.on b { background: var(--blue); color: #fff; }
  .main { height: calc(100% - 54px); display: grid; grid-template-columns: minmax(0, 1fr) 500px; }
  .world { position: relative; overflow: hidden; background: linear-gradient(#DCE3EA, #EDE8DD 70%); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; transition: opacity .45s ease; }
  #labels, #lead { position: absolute; inset: 0; pointer-events: none; transition: opacity .45s ease; } #lead { width: 100%; height: 100%; }
  .lbl { position: absolute; left: 0; top: 0; background: rgba(255, 255, 255, .96); border: 1px solid #C9CED6; border-radius: 7px; padding: 6px 10px; font-size: 15.5px; font-weight: 700; line-height: 1.25; color: var(--ink); white-space: nowrap; opacity: 0; box-shadow: 0 1px 3px rgba(14, 27, 51, .14); will-change: transform; }
  .lbl small { display: block; font-weight: 500; font-size: 13.5px; color: var(--ink); }
  .lbl.hot { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 71, 186, .18); }
  .bar { position: absolute; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; } .bar > * { pointer-events: auto; }
  .bar.t { top: 12px; } .bar.b { bottom: 12px; }
  .seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: 0 1px 3px rgba(14, 27, 51, .1); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 6px; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .seg button.on { background: var(--night); color: #fff; }
  .cap { background: rgba(255, 255, 255, .92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; color: var(--ink); max-width: 640px; }
  .panel { overflow-y: auto; background: var(--card); border-left: 1px solid var(--line); padding: 20px 22px 60px; }
  .panel h2 { font: 600 27px/1.2 var(--display); margin: 0 0 8px; } .panel h3 { font: 700 18px/1.3 var(--sans); margin: 22px 0 8px; }
  .panel p { margin: 0 0 12px; color: var(--ink); } .panel .ref { font-size: 14px; color: var(--ink); margin-bottom: 12px; }
  .term { border-bottom: 2px dotted var(--blue); font-weight: 600; cursor: pointer; color: var(--ink); }
  .pop { position: fixed; z-index: 30; width: 290px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(14, 27, 51, .22); font-size: 15.5px; }
  .pop b { display: block; font-size: 16.5px; margin-bottom: 3px; } .pop i { display: block; margin-top: 6px; color: var(--muted); font-style: normal; font-size: 12.5px; }
  .go { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 10px 12px; margin: 0 0 8px; font-size: 16px; }
  .go:hover { border-color: var(--blue); } .go.on { border-color: var(--blue); background: var(--blue2); } .go b { color: var(--blue); margin-right: 6px; }
  .btn { border: 1px solid var(--night); background: var(--night); color: #fff; border-radius: 8px; padding: 8px 13px; font-size: 15px; font-weight: 600; } .btn.ghost { background: #fff; color: var(--night); } .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .ctl { margin: 0 0 12px; } .ctl .hd { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 2px; } .ctl .hd b { font-variant-numeric: tabular-nums; }
  .sr { display: flex; align-items: center; gap: 8px; } .sr input[type=range] { flex: 1; accent-color: var(--blue); height: 26px; }
  .ng { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 17px; line-height: 1; } .ng:disabled, input:disabled { opacity: .4; }
  .lockn { font-size: 13.5px; color: var(--gold); margin-left: 6px; font-weight: 600; }
  .noz { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; } .noz .one { display: flex; align-items: center; gap: 5px; } .noz .v { width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .nozsvg { display: block; width: 100%; height: 86px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 4px; }
  .note { font-size: 15px; color: var(--ink); margin: 0 0 12px; }
  table.out { width: 100%; border-collapse: collapse; margin: 4px 0 6px; } table.out td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  table.out tr { cursor: pointer; } table.out tr.on td { background: var(--blue2); } table.out td.n { font-size: 16px; } table.out td.v { text-align: right; font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; } table.out td.v small { font-weight: 600; color: var(--ink); font-size: 14px; }
  table.out td.e { font-size: 14px; color: var(--ink); padding-top: 0; border-top: 0; overflow-x: auto; } table.out tr.eq { cursor: default; }
  .chart { width: 100%; height: auto; aspect-ratio: 400 / 190; display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; }
  .say { background: var(--paper); border-left: 3px solid var(--blue); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 15.5px; margin: 8px 0 12px; }
  .task { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; } .task.live { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 71, 186, .12); } .task.done { border-color: var(--green); background: #F1F8F4; }
  .task .q { font-weight: 600; font-size: 16px; } .task .st { font-size: 15px; color: var(--ink); margin-top: 4px; } .task.done .st { color: var(--green); } .task .btn { margin-top: 8px; padding: 6px 12px; font-size: 14.5px; }
  .given { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15.5px; margin-bottom: 12px; } .given div { display: flex; justify-content: space-between; gap: 10px; } .given div b { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pbar { display: flex; height: 30px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); margin: 4px 0; font-size: 14px; font-weight: 700; color: #fff; } .pbar div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; transition: width .25s ease; } .pbar .d { background: #4A5568; } .pbar .b { background: var(--blue); }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0 12px; } table.cmp th, table.cmp td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; } table.cmp th { font-size: 14px; color: var(--ink); font-weight: 700; } table.cmp td.r, table.cmp th.r { text-align: right; font-variant-numeric: tabular-nums; }
  table.cmp tr.best td { background: #F1F8F4; font-weight: 700; }
  .eqbox { overflow-x: auto; padding: 4px 0 8px; font-size: 14px; }
  .foot { font-size: 13.5px; color: var(--ink); margin-top: 26px; border-top: 1px solid var(--line); padding-top: 10px; }
  .next { margin-top: 18px; display: flex; justify-content: space-between; }
  @media (max-width: 980px) {
    body { overflow: auto; } .top { height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 8px; } .top .src { display: none; } .steps { margin-left: 0; overflow-x: auto; width: 100%; } .steps button { padding: 7px 9px; }
    .main { height: auto; display: block; } .world { height: 60vh; position: sticky; top: 0; z-index: 5; } .panel { border-left: 0; padding: 16px 14px 60px; } .cap { font-size: 13px; padding: 5px 8px; } .cap .long { display: none; }
    .bar { left: 8px; right: 8px; gap: 6px; } .bar.t { top: 8px; } .bar.b { bottom: 8px; } .seg { max-width: 100%; overflow-x: auto; } .seg button { white-space: nowrap; padding: 6px 8px; font-size: 13px; } .lbl { font-size: 13px; padding: 4px 7px; } .lbl small { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="ttl">Drilling bits and bit hydraulics</div>
  <div class="src">Bourgoyne, Millheim, Chenevert, Young · Applied Drilling Engineering · Ch. 5 with §4.7 and §4.13</div>
  <div class="steps" id="steps" role="navigation"></div>
</div>
<div class="main">
  <div class="world" id="world">
    <canvas id="gl"></canvas>
    <svg id="lead"></svg>
    <div id="labels"></div>
    <div class="bar t">
      <div class="seg" id="bitsel"><button data-b="tri">Rolling cutter bit</button><button data-b="pdc">PDC bit</button></div>
      <div class="seg" id="viewsel"></div>
      <div class="seg" id="pipesel"><button data-p="cut">See-through pipe</button><button data-p="whole">Solid pipe</button></div>
      <div class="cap" id="depth" hidden></div>
    </div>
    <div class="bar b"><div class="cap" id="cap"></div></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div class="pop" id="pop" hidden></div>
<script type="module" src="./app.js?v=17"></script>
</body>
</html>
